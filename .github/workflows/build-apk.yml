name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences du SDK Android
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Installer la plateforme Android nécessaire
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Autoriser l'exécution de gradlew
        run: chmod +x gradlew

      # Sans clé de signature fixe, Android Gradle Plugin en génère une nouvelle
      # à chaque run -> l'APK ne peut plus s'installer par-dessus la version
      # précédente (conflit de signature). On fixe donc une clé de debug stable,
      # générée une seule fois puis réutilisée (et committée) pour tous les runs suivants.
      - name: Générer une clé de debug stable (une seule fois)
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=PV Jointage Debug, OU=Terrain, O=ADF, L=, S=, C=FR"
          fi

      - name: Committer la clé de debug si nouvellement générée
        run: |
          if [ -n "$(git status --porcelain app/debug.keystore)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "Ajout de la clé de debug stable (signature APK constante entre les builds)"
            git push
          fi

      - name: Compiler l'APK (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK généré (artifact du run)
        uses: actions/upload-artifact@v4
        with:
          name: PVJointage-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Nom de fichier fixe pour que l'URL de téléchargement ne change jamais
      # (c'est cette URL qui est encodée dans le QR code de la tablette).
      - name: Préparer l'APK sous un nom stable
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PVJointage.apk

      # Republie (crée ou remplace) une release GitHub à tag fixe "tablette-latest".
      # L'asset est donc toujours accessible à la même URL, quel que soit le run :
      # https://github.com/<owner>/<repo>/releases/download/tablette-latest/PVJointage.apk
      # -> c'est cette URL stable que le QR code de la tablette doit viser.
      - name: Publier/mettre à jour la release "tablette-latest"
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: tablette-latest
          name: "Dernière version (tablette)"
          body: >
            APK reconstruit automatiquement à chaque lancement manuel du workflow
            "Build APK". Toujours disponible à la même URL : c'est celle-ci qu'il
            faut scanner avec le QR code collé sur la tablette.
          files: app/build/outputs/apk/debug/PVJointage.apk
