name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences du SDK Android
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Installer la plateforme Android nécessaire
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Autoriser l'exécution de gradlew
        run: chmod +x gradlew

      - name: Compiler l'APK (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: PVJointage-debug-apk
          path: app/build/outputs/apk/debug/*.apk
